<!DOCTYPE html>
<html lang="en">
<head>
  <title>Belize Map Game</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
  
  
  body
{
background-image: url('belize.jpg');
background-size: cover;
background-repeat: no-repeat;
background-position: center center; 
}


.heading
{
text-align: center;
text-shadow: 2px 2px yellow;
padding: 20px;
margin: auto;
margin: 10px;
font-family: Courier New, monospace;
font-weight: bold;
color: black;
}

.image
{
border-radius: 10px;
margin:auto;
box-shadow: 3px 3px yellow;
height: auto;
max-width: 50%;
margin: 10px;
}


.image-container
{
display:flex;
justify-content: center;
align-items: center;
padding: 20px;
margin: auto;
border: 0px solid tomato;
border-radius: 25px;
margin: 20px;
text-align: center;
}

.button-container
{
padding: 10px;
margin: auto;
display: flex;
justify-content: center;
align-items: center;
border:0px solid black;
margin: 20px;
text-align: center;
}

.button-group span
{
display: inline-block;
}

.button-group
{ margin-top: auto;}

.button
{
padding:7px;
border: 0px;
border-radius: 10px;
box-shadow: 2px 2px yellow;
color: black;
background-color: transparent;
postion:fixed;
bottom: 0; 
font-family: Courier New, monospace;
}

  
  </style>
</head>
<body>


<div class="heading">
<h2>Simple Belize Map Game</h2>
</div>


<div class="big-container">

<div class="image-container">
<div class="image">
<img id="myImage" src="map.png">
</div>
</div>


<div class="button-container">
<div class= "button-group">
<button class= "button" onclick="document.getElementById('myImage').src='corozal.png'">Corozal</button>

<button class= "button" onclick="document.getElementById('myImage').src='orangewalk.png'">Orange walk</button>

<button class= "button" onclick="document.getElementById('myImage').src='belize.png'">Belize</button>

<button class= "button" onclick="document.getElementById('myImage').src='cayo.png'">Cayo</button>

<button class= "button" onclick="document.getElementById('myImage').src='stanncreek.png'">Stann creek</button>

<button class= "button" onclick="document.getElementById('myImage').src='toledo.png'">Toledo</button>

<button class= "button" onclick="document.getElementById('myImage').src='map.png'">Reset</button>

</div>
</div>



<div class="button-container">
<div class="button-group">

<button  class="button" onclick= "document.location='index.html'">Course</button>
 
<button   class="button" onclick= "document.location='project.html'">Projects</button>

<button   class="button" onclick= "document.location='concepts.html'">Concepts</button>

<button  class="button" onclick= "document.location='databases.html'">Data-Bases</button>

<button   class="button" onclick= "document.location='documentation.html'">Documentation</button>

<button   class="button" onclick= "document.location='dev.html'">Dev Team</button>

</div>
</div>






</body>
</html>
