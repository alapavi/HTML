<!DOCTYPE html>
<html>
<head>
<title> Calculators </title>
</head>
 <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>


.parent-container
{
padding: 10px;
margin:25px;
background-color: cyan;
border: 5px  solid black;
border-radius: 25px;
box-shadow: 10px 9px;
width:400px;
align-items : center;
}


.container
{  display:flex;
 justify-content: center;
  align-items: center;
  padding: 7px;
  }
  
  
  .heading
{  display:flex;
 justify-content: center;
  align-items: center;
  padding: 7px;
  text-shadow: 0 0 3px #ff0000;
  }

  body {
  font-family: "Lucida Console", "Courier New", monospace;
  background-image: url('calc.png');
   background-attachment:fixed;
  background-repeat: no-repeat;
  background-size: cover;
  }

button {
  background-color: gray;
  border-radius: 10px;
  box-shadow: 2px 2px;
}
input {
border-radius: 5px;
text-align: center;
}



  </style>

<body>
    
    <div class= "parent-container">
    
    <div class= "heading" >
    <h2>Sum Calculator</h2>
    </div>
    <div class= "container" >
    <input type="number" id="num1" placeholder="Enter Number 1"> </div>
    <div class= "container" >
    <input type="number" id="num2" placeholder="Enter Number 2"></div>
    <div class= "container" >
    <button  onclick="getSum()">Calculate Sum</button></div>
    <div class= "container" >
    <p> Your Answer is : <span id="result"></span> </p>
	</div> 
   
   </div>
   
   
     <div class= "parent-container">
    
    <div class= "heading" >
    <h2>Difference Calculator</h2>
    </div>
    <div class= "container" >
    <input type="number" id="dnum1" placeholder="Enter Number 1"> </div>
    <div class= "container" >
    <input type="number" id="dnum2" placeholder="Enter Number 2"></div>
    <div class= "container" >
    <button  onclick="getDiff()">Calculate Difference</button></div>
    <div class= "container" >
    <p> Your Answer is : <span id="result1"></span> </p>
	</div> 
   
   </div>
   
       
    <div class= "parent-container">
    
    <div class= "heading" >
    <h2>Product Calculator</h2>
    </div>
    <div class= "container" >
    <input type="number" id="pnum1" placeholder="Enter Number 1"> </div>
    <div class= "container" >
    <input type="number" id="pnum2" placeholder="Enter Number 2"></div>
    <div class= "container" >
    <button  onclick="getPro()">Calculate Product</button></div>
    <div class= "container" >
    <p> Your Answer is : <span id="result2"></span> </p>
	</div> 
   
   </div>
   
       
    <div class= "parent-container">
    
    <div class= "heading" >
    <h2>Division Calculator</h2>
    </div>
    <div class= "container" >
    <input type="number" id="num1d" placeholder="Enter Number 1"> </div>
    <div class= "container" >
    <input type="number" id="num2d" placeholder="Enter Number 2"></div>
    <div class= "container" >
    <button  onclick="getDiv()">Divide</button></div>
    <div class= "container" >
    <p> Your Answer is : <span id="result3"></span> </p>
	</div> 
   
   </div>
   
   
   
    <script>
    
        function getSum() {
            let num1 = parseFloat(document.getElementById('num1').value);
            let num2 = parseFloat(document.getElementById('num2').value);
            let sum = num1 + num2;
            document.getElementById('result').textContent = sum;}
            
         function getDiff() { 
            let dnum1 = parseFloat(document.getElementById('dnum1').value);
            let dnum2 = parseFloat(document.getElementById('dnum2').value);
			let diff = dnum1 - dnum2;
            document.getElementById('result1').textContent = diff;}
            
                        
         function getPro() { 
            let pnum1 = parseFloat(document.getElementById('pnum1').value);
            let pnum2 = parseFloat(document.getElementById('pnum2').value);
			let pro = pnum1 * pnum2;
            document.getElementById('result2').textContent = pro;}
            
                        
         function getDiv() { 
            let num1d = parseFloat(document.getElementById('num1d').value);
            let num2d = parseFloat(document.getElementById('num2d').value);
			let div = num1d / num2d;
            document.getElementById('result3').textContent = div;
            
            
            if(num2d <= 0){
            let message = "INVALID NUMBER";
            document.getElementById('result3').textContent = message;
            }
            
         }
            
            
            
    </script>
    
</body>

</html>
