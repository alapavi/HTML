<h1>Calculators</h1>
</div>

<div class="big-container">




<div class="container">

<div class="sub-heading">
<h2>Sum</h2>
</div>
 
<div class="group">
<input type="number" id="n1" placeholder="Enter Number 1" class="small-container">

 <input type="number" id="n2" placeholder="Enter Number 2" class="small-container"> 
 <p> </p>
<button  onclick="getSum()" class="calculator-button" >Calculate Sum</button>

<p> Your Answer is : <span id="result"></span> </p>
 
 </div>
 </div>
 

    <script>
        function getSum() {
            let n1 = parseFloat(document.getElementById('n1').value);
            let n2 = parseFloat(document.getElementById('n2').value);
            let sum = n1 + n2;
            document.getElementById('result').textContent = sum;    
        }
    </script>
    
<div class="container">

<div class="sub-heading">
<h2>Difference</h2>
</div>
 
<div class="group">

<input type="number" id="dn1" placeholder="Enter Number 1" class="small-container">
 <input type="number" id="dn2" placeholder="Enter Number 2" class="small-container"> 
 
 <p> </p>
 <button  onclick="getDiff()" class="calculator-button">Calculate Difference</button>
    
 <p> Your Answer is : <span id="result2"></span> </p>
 
 </div>
 </div>
 

    <script>
        function getDiff() {
            let dn1 = parseFloat(document.getElementById('dn1').value);
            let dn2 = parseFloat(document.getElementById('dn2').value);
            let diff = dn1 - dn2;
            document.getElementById('result2').textContent = diff;    
        }
    </script>
    
    
<div class="container">

<div class="sub-heading">
<h2>Product</h2>
</div>
 
<div class="group">

<input type="number" id="mn1" placeholder="Enter Number 1" class="small-container">
 

 <input type="number" id="mn2" placeholder="Enter Number 2" class="small-container"> 
 
 <p> </p>
 <button  onclick="getPro()" class="calculator-button">Calculate Product</button>
    
 <p> Your Answer is : <span id="result3"></span> </p>
 
 </div>
 </div>
 

    <script>
        function getPro() {
            let mn1 = parseFloat(document.getElementById('mn1').value);
            let mn2 = parseFloat(document.getElementById('mn2').value);
            let pro = mn1 * mn2;
            document.getElementById('result3').textContent = pro;    
        }
    </script>
    
    
   
<div class="container">

<div class="sub-heading">
<h2>Division</h2>
</div>
 
<div class="group">

<input type="number" id="divn1" placeholder="Enter Number 1" class="small-container">
 

 <input type="number" id="divn2" placeholder="Enter Number 2" class="small-container"> 
 
 <p> </p>
 <button  onclick="getDiv()" class="calculator-button">Calculate Division</button>
    
 <p> Your Answer is : <span id="result4"></span> </p>
 
 </div>
 </div>
 

    <script>
        function getDiv() {
            let divn1 = parseFloat(document.getElementById('divn1').value);
            let divn2 = parseFloat(document.getElementById('divn2').value);
            let div = divn1 / divn2;
            let msg= "CANNOT DIVIDE BY ZERO";  
            document.getElementById('result4').textContent = div;
             
             
             if (divn2 === 0)
            {document.getElementById('result4').textContent = msg;}
            
        
            }
           
       
    </script>
