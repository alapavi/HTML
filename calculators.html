<!DOCTYPE html>
<html>
<head>
<title> Sum Calculator </title>
</head>
 <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>


.parent-container
{
padding: 10px;
margin:25px;
background-color: cyan;
border: 5px  solid black;
border-radius: 25px;
box-shadow: 10px 9px;
}


.container
{  display:flex;
 justify-content: center;
  align-items: center;
  padding: 7px;
  }
  
  
  .heading
{  display:flex;
 justify-content: center;
  align-items: center;
  padding: 7px;
  text-shadow: 0 0 3px #ff0000;
  }

  body {
  font-family: "Lucida Console", "Courier New", monospace;
  background-image: url('calc.png');
   background-attachment:fixed;
  background-repeat: no-repeat;
  background-size: cover;
  }

button {
  background-color: gray;
  border-radius: 10px;
  box-shadow: 2px 2px;
}
input {
border-radius: 5px;
text-align: center;
}



  </style>

<body>
    
    <div class= "parent-container">
    
    <div class= "heading" >
    <h2>Sum Calculator</h2>
    </div>
    <div class= "container" >
    <input type="number" id="n1" placeholder="Enter Number 1"> </div>
    <div class= "container" >
    <input type="number" id="n2" placeholder="Enter Number 2"></div>
    <div class= "container" >
    <button  onclick="getSum()">Calculate Sum</button></div>
    <div class= "container" >
    <p> Your Answer is : <span id="result"></span> </p>
	</div> 
   
   </div>

    <script>
        function getSum() {
            // Get the values from the input fields
            let n1 = parseFloat(document.getElementById('n1').value);
            let n2 = parseFloat(document.getElementById('n2').value);
            
            // Calculate the sum
            
            let sum = n1 + n2;
            
            
            
            // Display the result
            document.getElementById('result').textContent = sum;
         
        }
    </script>
    
</body>
</html>
