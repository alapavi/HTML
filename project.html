    list-style-type: none;
    margin: 0;
    padding: 0;
    width: 200px;
    background-color: #f1f1f1;
    float: left; /* keeps sidebar on the left */
  }

  .sidenav li a {
    display: block;
    color: black;
    padding: 8px 16px;
    text-decoration: none;
  }

  .sidenav li a.active {
    background-color: #520a18;
    color: white;
  }

  .sidenav li a:hover:not(.active) {
    background-color: #9e4d4d;
    color: white;
  }

  /* make image appear beside sidebar */
  .content {
    float: left; /* aligns beside sidebar */
    margin-left: 20px; /* spacing between sidebar and image */
  }

  .content img {
    display: block;
    width: 1000px; /* fixed width so it fits beside sidebar */
    height: auto;
  }

  /* clear float for bottom navbar */
  nav {
    clear: both;
  }
  </style>
</head>
