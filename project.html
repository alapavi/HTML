<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap 5 Website Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<style>

/* ORIGINAL STYLES LEFT UNCHANGED EXCEPT IMAGE AREA */

body {
  background-image: url('defaultbackground.jpg');
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center center; 
  background-attachment: fixed; 
}

.heading {
  text-align: center;
  text-shadow: 2px 2px yellow;
  padding: 20px;
  margin: auto;
  margin: 10px;
  font-family: Courier New, monospace;
  font-weight: bold;
  color: white;
}

/* --- UPDATED IMAGE STYLING --- */

.image-container {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 10px;
  margin: auto;
  border-radius: 15px;
  text-align: center;
  background-color: transparent;
}

.image-group {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

/* UNIFORM RESPONSIVE IMAGE SIZE */
.image {
  width: 100%;
  max-width: 180px;   /* Change this to resize all images */
  height: auto;
  border-radius: 10px;
  box-shadow: 3px 3px yellow;
}

/* -------------------------------- */

.text {
  padding: 20px;
  font-family: Courier New, monospace;
  text-align: center;
  margin: auto;
  margin: 20px;
  color: white;
}

/* BUTTONS LEFT UNCHANGED */
.button-container {
  padding: 10px;
  margin: auto;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 20px;
  text-align: center;
}

.button-group span {
  display: inline-block;
}

.button-group { margin-top: auto; }

.button {
  padding:7px;
  border: 0px;
  border-radius: 10px;
  box-shadow: 2px 2px yellow;
  color: white;
  background-color: transparent;
  font-family: Courier New, monospace;
}

</style>
</head>
<body>

<div class="heading">
<h1> Projects </h1>
</div>

<div class="image-container">
  <div class="image-group">

    <a href="Flipflop.html"><img src="offFlipflop.png" class="image" alt="Flip-flop"></a>

    <a href="bmi.html"><img src="bmithumbnail.jpg" class="image" alt="BMI calculator"></a>

    <a href="calculators.html"><img src="calculatorthumbnail.jpg" class="image" alt="Calculators"></a>

    <a href="belizemapgame.html"><img src="mapgamethumbnail.jpg" class="image" alt="Belize map game"></a>

    <a href="logicgates.html"><img src="logicgatethumbnail.png" class="image" alt="Logic gates"></a>

    <a href="myjava.html"><img src="myjavacover.jpg" class="image" alt="My java"></a>

  </div>
</div>

<div class="text">
  <h4>All of my projects are located here. Click on the images to go to each one of them.</h4>
</div>

<div class="button-container">
  <div class="button-group">
    <button class="button" onclick="document.location='index.html'">Course</button>
    <button class="button" onclick="document.location='project.html'">Projects</button>
    <button class="button" onclick="document.location='concepts.html'">Concepts</button>
    <button class="button" onclick="document.location='databases.html'">Data-Bases</button>
    <button class="button" onclick="document.location='documentation.html'">Documentation</button>
    <button class="button" onclick="document.location='dev.html'">Dev Team</button>
    <button class="button" onclick="document.location='myresume.html'">Resume</button>
  </div>
</div>

</body>
</html>
