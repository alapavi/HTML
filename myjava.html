<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap 5 Website Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>

 #container {
      width: 90vw;  
      max-width: 500px;
      height: 70vw; 
      max-height: 400px;
      border: 1px solid black;

    #box {
      width: 4%;

      background: red;

    }

    #goal {
      width: 4%;
      height: 5%;
      background: green;
      top: 92%;
      left: 92%;
    }

    .wall {
      background: black;
    }




body
{
    display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;

background-image: url('defaultbackground.jpg');
background-size: cover;
background-repeat: no-repeat;
background-position: center center; 
background-attachment: fixed; 
}


.heading
{

text-shadow: 2px 2px yellow;
padding: 20px;
margin: auto;
margin: 10px;
font-family: Courier New, monospace;
font-weight: bold;
color: black;}

{

{

}

  
.button-container
{
padding: 10px;
margin: auto;
display: flex;
justify-content: center;

border:0px solid black;

}

.button-group span
{ display: inline-block; }

.button-group
{ margin-top: auto;}

  

.button
{
padding:7px;
border: 0px;
border-radius: 10px;
box-shadow: 2px 2px yellow;
color: white;
background-color: transparent;
postion:fixed;
bottom: 0; 
font-family: Courier New, monospace;
}

.container
{display: flex;
flex-direction: column;
height: 100%;
text-align: center;
}

.button-group span
{ display: inline-block;}

.button-group
{ margin-top: auto;}

<body>

<div class="heading">
<h1>Abstraction</h1>
 </div> 


<div id="container">
  <div id="box"></div>
  <div id="goal"></div>

  <!-- Maze walls (percentages) -->
  <div class="wall" style="top:10%; left:0%; width:50%; height:2%;"></div>
  <div class="wall" style="top:10%; left:50%; width:2%; height:10%;"></div>
  
    <div class="wall" style="top:0%; left:70%; width:2%; height:20%;"></div>
    
  <div class="wall" style="top:30%; left:40%; width:60%; height:2%;"></div>
  
  <div class="wall" style="top:28%; left:20%; width:2%; height:20%;"></div>
  
  
  
  
  <div class="wall" style="top:46%; left:20%; width:35%; height:2%;"></div>
  
  
  <div class="wall" style="top:46%; left:68%; width:2%; height:30%;"></div>
  
  
  
  <div class="wall" style="top:74%; left:30%; width:40%; height:2%;"></div>
  <div class="wall" style="top:74%; left:30%; width:2%; height:18%;"></div>
  <div class="wall" style="top:90%; left:50%; width:2%; height:10%;"></div>
  <div class="wall" style="top:90%; left:50%; width:35%; height:2%;"></div>
  
   <div class="wall" style="top:60%; left0%; width:35%; height:2%;"></div>
   
   <div class="wall" style="top:60%; left:80%; width:20%; height:2%;"></div>
</div>



<div class= "text">
<p> Abstraction is the concept of hiding the internal details of a system or object and showing only the essential features, so you can use it without needing to understand how it works inside.</p>


<div class="button-container">
<div class="button-group">
  <button class= "button" onclick="moveLeft()">Left</button>
  <button class= "button"onclick="moveDown()">Down</button>
  <button class= "button"onclick="moveUp()">Up</button>
  <button class= "button"onclick="moveRight()">Right</button>
</div>
</div>

<script>
  let box = document.getElementById("box");
  let cont = document.getElementById("container");
  let goal = document.getElementById("goal");
  let walls = document.querySelectorAll(".wall");

  let xPercent = 2;
  let yPercent = 2;
  const stepPercent = 4;

  function updateBox() {
    box.style.left = xPercent + "%";
    box.style.top = yPercent + "%";
  }

  function checkCollision(newX, newY) {
    const contWidth = cont.clientWidth;
    const contHeight = cont.clientHeight;
    const boxWidth = box.offsetWidth;
    const boxHeight = box.offsetHeight;

    const px = (newX / 100) * contWidth;
    const py = (newY / 100) * contHeight;

    if (px < 0 || py < 0 || px + boxWidth > contWidth || py + boxHeight > contHeight) return true;

    for (let wall of walls) {
      const wX = wall.offsetLeft;
      const wY = wall.offsetTop;
      const wW = wall.offsetWidth;
      const wH = wall.offsetHeight;

      if (!(px + boxWidth <= wX || px >= wX + wW || py + boxHeight <= wY || py >= wY + wH)) return true;
    }
    return false;
  }

  function checkGoal() {
    const contWidth = cont.clientWidth;
    const contHeight = cont.clientHeight;

    const px = (xPercent / 100) * contWidth;
    const py = (yPercent / 100) * contHeight;

    if (!(px + box.offsetWidth <= goal.offsetLeft || px >= goal.offsetLeft + goal.offsetWidth ||
          py + box.offsetHeight <= goal.offsetTop || py >= goal.offsetTop + goal.offsetHeight)) {
      alert("You Win!");
      xPercent = 2;
      yPercent = 2;
      updateBox();
    }
  }

  function moveDown() { if (!checkCollision(xPercent, yPercent + stepPercent)) { yPercent += stepPercent; updateBox(); checkGoal(); } }
  function moveUp() { if (!checkCollision(xPercent, yPercent - stepPercent)) { yPercent -= stepPercent; updateBox(); checkGoal(); } }
  function moveLeft() { if (!checkCollision(xPercent - stepPercent, yPercent)) { xPercent -= stepPercent; updateBox(); checkGoal(); } }
  function moveRight() { if (!checkCollision(xPercent + stepPercent, yPercent)) { xPercent += stepPercent; updateBox(); checkGoal(); } }

  updateBox();
</script>










</body>
</html>
