<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap 5 Website Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>

body
{
background-image: url('defaultbackground.jpg');
background-size: cover;
background-repeat: no-repeat;
background-position: center center; 
background-attachment: fixed; 
}


.heading
{
text-align: center;
text-shadow: 2px 2px yellow;
padding: 20px;
margin: auto;
margin: 10px;
font-family: Courier New, monospace;
font-weight: bold;
color: black;}

.image
{
display: flex;
justify-content: center;
align-items: center;
margin:auto;
margin:20px;
padding:20px;
border-radius: 7px;
box-shadow: 2px 2px yellow;
}

.text
{
padding: 20px;
font-family:Courier New, monospace;
text-align: center;
margin: auto;
margin: 20px;
color: white;

}

  
.button-container
{
padding: 10px;
margin: auto;
display: flex;
justify-content: center;
align-items: center;
border:0px solid black;
margin: 20px;
text-align: center;
}

.button-group span
{ display: inline-block; }

.button-group
{ margin-top: auto;}

  

.button
{
padding:7px;
border: 0px;
border-radius: 10px;
box-shadow: 2px 2px yellow;
color: white;
background-color: transparent;
postion:fixed;
bottom: 0; 
font-family: Courier New, monospace;
}

.container
{display: flex;
flex-direction: column;
height: 100%;
text-align: center;
}

.button-group span
{ display: inline-block;}

.button-group
{ margin-top: auto;}


  </style>
</head>
<body>

<div class="heading">
<h1>Resume</h1>
 </div> 


<div class="image">
<a href="resume.pdf"><img src="resumetumbnail.jpg" alt="my resume" width="100%"></a>
</div>

<div class="text">
<h3>Click on the image above to go to my resume.</h3>
</div>


<div class="button-container">
<div class="button-group">

<button  class="button" onclick= "document.location='index.html'">Course</button>
 
<button   class="button" onclick= "document.location='project.html'">Projects</button>

<button   class="button" onclick= "document.location='concepts.html'">Concepts</button>

<button  class="button" onclick= "document.location='databases.html'">Data-Bases</button>

<button   class="button" onclick= "document.location='documentation.html'">Documentation</button>

<button   class="button" onclick= "document.location='dev.html'">Dev Team</button>

<button  class="button" onclick= "document.location='myresume.html'">Resume</button>

</div>
</div>






</body>
</html>
