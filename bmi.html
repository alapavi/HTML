<!DOCTYPE html>
<html>
<head>
<title> Find BMI </title>
</head>
 <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
  .fakeimg {
    height: 200px;
    background: #abb;
  }
  body {
  font-family: "Lucida Console", "Courier New", monospace;
}
body {
  background-color: lightblue;
}
button {
  background-color: gray;
  border-radius: 10px
}
input {
border-radius: 5px;
text-align: center;
}



  </style>

<body>
<center>
    
    <p></p>
    <h2>BMI Calculator</h2>
    <p></p>
    <input type="number" id="height" placeholder="Enter Height in Inches">
      <p> </p>
    <input type="number" id="weight" placeholder="Enter Weight in Pounds">
    <p> </p>
    <button  onclick="getBmi()">Calculate BMI</button>
    <p></p>
    <p> Your BMI is : <span id="result"></span> </p>
    <p><span id= "bmir" ></span> </p>
    
    <p></p>

    <script>
        function getBmi() {
            // Get the values from the input fields
            let height = parseFloat(document.getElementById('height').value);
            let weight = parseFloat(document.getElementById('weight').value);
            
            // Calculate the sum
            
            let fheight = height * height;
            let weightandheight = weight / fheight;
            let bmi = weightandheight * 703;
            let uw = "You are underweight";
            let n = "You are normal";
            let ow = "You are overweight"
            let ob = "You are obese";
            
            
            // Display the result
            document.getElementById('result').textContent = bmi.toFixed(1);
            
            
            
            if (bmi < 18.5)
            {  document.getElementById('bmir').textContent = uw;}
            
            else if (bmi < 25)
            {  document.getElementById('bmir').textContent = n;}
            
              else if (bmi < 30)
            { document.getElementById('bmir').textContent = ow; }
            
              else if (bmi > 30)
            { document.getElementById('bmir').textContent = ob; }
            
             
            
            
        }
    </script>
    
   </center>
</body>
</htm
