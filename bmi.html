<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator (Imperial)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .bmi-calculator {
      max-width: 400px;
      margin: 50px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .result-display {
      margin-top: 20px;
      padding: 10px;
      background-color: #f8f9fa;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body class="bg-light">

<div class="bmi-calculator text-center">
  <h2 class="mb-4">BMI Calculator</h2>
  
  <div class="mb-3 text-start">
    <label for="height" class="form-label">Height (inches):</label>
    <input type="number" id="height" step="0.1" placeholder="e.g., 70" class="form-control">
  </div>

  <div class="mb-3 text-start">
    <label for="weight" class="form-label">Weight (lbs):</label>
    <input type="number" id="weight" step="0.1" placeholder="e.g., 150" class="form-control">
  </div>

  <button id="calculateBmi" class="btn btn-dark w-100">Calculate BMI</button>

  <div class="result-display mt-3">
    <p>Your BMI: <span id="bmiResult"></span></p>
    <p><span id="bmiStatement"></span></p>
  </div>
</div>

<script>
  document.getElementById('calculateBmi').addEventListener('click', function() {
    const height = parseFloat(document.getElementById('height').value);
    const weight = parseFloat(document.getElementById('weight').value);

    if(height > 0 && weight > 0){
      // BMI formula for imperial units
      const bmi = ((weight * 703) / (height * height)).toFixed(2);
