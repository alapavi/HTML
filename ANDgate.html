<!DOCTYPE html>
<html>
<head>
<title>Logic Gates</title>

 <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<style>


body
{
background-image: url('defaultbackground.jpg');
background-size: cover;
background-repeat: no-repeat;
background-position: center center; 
background-attachment: fixed; 
}


.button
{
padding:7px;
border: 0px;
border-radius: 10px;
box-shadow: 2px 2px gray;
color: white;
background-color: transparent;
postion:fixed; 
bottom: 0; 
font-family: Courier New, monospace;
}

.button-container
{
padding: 10px;
margin: auto;
display: flex;
justify-content: center;
align-items: center;
border:0px solid black;
margin: 20px;
text-align: center;
}

.button-group span
{
display: inline-block;
}

.button-group
{ margin-top: auto;}


.heading
{
text-align: center;
text-shadow: 2px 2px yellow;
padding: 20px;
margin: auto;
margin: 20px;
font-family: Courier New, monospace;
font-weight: bold;
color: white;
}
  


.image
{

}



.image-container
{

}

.image-group 
{
display: inline-block;
}







</style>
</head>
<body>












<div class="heading">
<h1>AND Gate</h1>
</div>



<div class="image-container">
<div class="image-group">
<img class="image" id="myImage" src="AND0and0.png">
</div>
</div>



 <div class= "button-container" > 
 <div class= "button-group">

<button class="button" onclick="document.getElementById('myImage').src='AND0and0.png'">0 and 0</button>
<button class="button" onclick="document.getElementById('myImage').src='AND1and0.png'">1 and 0</button>
<button class="button" onclick="document.getElementById('myImage').src='AND0and1.png'">0 and 1</button>
<button class="button" onclick="document.getElementById('myImage').src='AND1and1.png'">1 and 1</button>
</div>
</div>

  
</body>

</html>
